[package]
name = "base-project"
version = "0.1.12"
edition = "2024"
license = "MIT"
repository = "https://github.com/base-rs/base-project"
description = "Shared project conventions and development tasks for Base Rust crates"
readme = "readme.md"
include = ["src/**", "context/**", "Cargo.toml", "readme.md", "license.md", "releases.md", "releases/**"]

[workspace]
members = ["bake"]
resolver = "3"

[workspace.metadata.bake]
manifest = "bake/Cargo.toml"

[workspace.metadata.bake.release]
reviewers = ["base-rs/maintainers"]

[lib]
name = "base_project"

[dependencies]
bake = ">=0.20.2"
bake-agent-context = { version = ">=0.4.5" }
bake-cargo = { version = ">=0.11.0" }
bake-license = { version = ">=0.2.11" }
bake-markdown = { version = ">=0.6.2" }
bake-readme = { version = ">=0.3.2" }
bake-releases = { version = ">=0.3.12" }
bake-test = { version = ">=0.3.9" }
base-design = { version = ">=0.1.1" }
base-security = { version = ">=0.2.1" }

[dev-dependencies]
tempfile = "3"
