[package]
name = "base-project"
version = "0.1.9"
edition = "2024"
license = "MIT"
repository = "https://github.com/base-rs/base-project"
description = "Shared project conventions and development tasks for Base Rust crates"
readme = "readme.md"
include = ["src/**", "context/**", "Cargo.toml", "readme.md", "license.md", "releases.md", "releases/**"]

[workspace]
members = ["bake"]
resolver = "3"

[workspace.metadata.bake]
manifest = "bake/Cargo.toml"

[workspace.metadata.bake.release]
reviewers = ["base-rs/maintainers"]

[lib]
name = "base_project"

[dependencies]
# Requiring bake 0.20.2, which declares Rust 1.88, would make a Rust 1.87 workspace resolve bake 0.19.2 for the task crates' open `bake` requirements as well, and fail to compile.
bake = ">=0.20.0"
bake-agent-context = { version = ">=0.4.4" }
bake-cargo = { version = ">=0.9.2" }
bake-license = { version = ">=0.2.10" }
bake-markdown = { version = ">=0.6.1" }
bake-readme = { version = ">=0.3.1" }
bake-releases = { version = ">=0.3.8" }
bake-test = { version = ">=0.3.8" }
base-design = { version = ">=0.1.1" }
base-security = { version = ">=0.2.1" }

[dev-dependencies]
tempfile = "3"
